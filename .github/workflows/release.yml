# Tag a commit (git tag v4.0.1 && git push origin v4.0.1) and this workflow
# builds every platform with that version stamped in, then publishes the
# cross-built binaries. GitHub already attaches the source archives for a tag,
# so the workflow does not create its own copies.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, tag name included (e.g. v4.0.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # VERSION is the tag name and is what the binary reports. Asset names do
      # not carry it: GitHub already scopes assets per release, and a stable
      # name lets /releases/latest/download/<asset> follow the newest release.
      - name: resolve version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME}"
          fi
          if [ -z "${version}" ]; then
            echo "no version: pass one with workflow_dispatch or push a tag" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "${GITHUB_ENV}"
          echo "version ${version} (binaries report it; asset names stay unversioned)"

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./coremain/ ./plugin/executable/fakeip_nat/ ./plugin/executable/telegram_bot/ ./tools/crossbuild/ -count=1

      # The version travels into every binary through the tool, which is the same
      # path a local build takes.
      - name: cross build
        run: go run ./tools/crossbuild -version "${VERSION}"

      - name: package binaries
        run: |
          set -euo pipefail
          mkdir -p dist

          # Keep the asset name stable across releases. The version is already
          # stamped into the binary, and GitHub scopes assets per release, so
          # the prefix is not needed to avoid collisions.
          for f in build/mosdns-*; do
            target="${f#build/mosdns-}"
            ext=""
            case "${target}" in
              *.exe) ext=".exe"; target="${target%.exe}" ;;
            esac
            cp "${f}" "dist/mosdns-${target}${ext}"
          done

          # One checksum file for everything that is about to be published.
          ( cd dist && sha256sum * > SHA256SUMS.txt )

          echo "files to publish:"
          ls -lh dist

      # Uploading over an existing release replaces the asset, which makes a
      # re-run after a failed step safe.
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" dist/* --clobber
          else
            gh release create "${VERSION}" dist/* \
              --title "${VERSION}" \
              --generate-notes \
              --target "${GITHUB_SHA}"
          fi
